# QB — Production stack (Oracle Cloud Free Tier / any Docker host)
# Runs: PostgreSQL + FastAPI backend + React frontend + Caddy (auto HTTPS)
# Usage: see deploy/setup.sh (one command) or deploy/DEPLOYMENT.md
#
# NOTE: this file lives in deploy/ — build contexts use ../backend and ../frontend

name: qb-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qb_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: qb_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qb_user -d qb_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # NOT published to the host — only reachable on the internal docker network.

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://qb_user:${POSTGRES_PASSWORD}@db:5432/qb_db
      ENVIRONMENT: production
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      SEED_DEFAULT_USERS: "false"
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@qb.com}
      FIRST_ADMIN_FULL_NAME: ${FIRST_ADMIN_FULL_NAME:-مدير النظام}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?FIRST_ADMIN_PASSWORD is required}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-QB System <no-reply@qb-system.com>}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # NOT published to the host — reachable only through Caddy.

  frontend:
    build:
      context: ../frontend
      args:
        # Same-origin API: Caddy proxies /api/* -> backend, so the browser calls
        # the API on the exact same domain (no CORS, no hardcoded host).
        VITE_API_URL: /api/v1
    depends_on:
      - backend
    restart: unless-stopped
    # NOT published to the host — reachable only through Caddy.

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Filled by setup.sh (domain => HTTPS, empty => :80 HTTP fallback)
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
  caddy_data:
  caddy_config: