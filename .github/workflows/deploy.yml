name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

# Prevent concurrent deploys
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/qb-backend:latest

jobs:
  build-frontend:
    name: Build Frontend (GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # VITE_API_URL: for GitHub Pages the frontend is static and calls the backend
      # on a separate domain (Koyeb/Render). Set via repo Variable or Secret.
      # If not set, build uses placeholder that can be overridden at runtime via window.__QB_API_URL__.
      # For same-origin Docker/Caddy deploys, VITE_API_URL=/api/v1 is baked in docker-compose.prod.yml.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_GH_PAGES: "true"
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '' }}

      # SPA fallback for GitHub Pages: 404.html -> index.html
      - name: Add SPA fallback (404.html)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    name: Push Backend to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qb-backend:latest
            ghcr.io/${{ github.repository_owner }}/qb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
