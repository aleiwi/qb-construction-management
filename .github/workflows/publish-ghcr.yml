name: Publish backend image to GHCR (manual)

# NOTE: Automated GHCR push is now handled by .github/workflows/deploy.yml (deploy-backend job)
# This workflow is kept for manual rebuilds only (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/qb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
