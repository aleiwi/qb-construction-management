<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Early favicon + runtime config fix for GH Pages base path (must run before <link> fetch)
      (function(){
        var isGhPages = location.hostname.includes('github.io') && location.pathname.indexOf('/qb-construction-management')===0;
        var base = isGhPages ? '/qb-construction-management/' : '/';
        // Inject favicon with correct base before browser fetches it
        var link = document.createElement('link');
        link.rel = 'icon';
        link.type = 'image/svg+xml';
        link.href = base + 'favicon.svg';
        document.head.appendChild(link);
        // Runtime API override
        try {
          var ls = localStorage.getItem('QB_API_URL');
          if (ls) window.__QB_API_URL__ = ls;
        } catch(e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المقاولات المتكامل</title>
    <!-- Runtime config: load runtime-config.js (optional, for GH Pages without rebuild) -->
    <script src="./runtime-config.js"></script>
    <!-- Google Fonts Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-slate-100 font-arabic min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
